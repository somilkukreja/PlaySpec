<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — PlaySpec</title>
  <meta name="description" content="Sign in to PlaySpec with your Steam account or email to track game prices, historical lows, and benchmark PC compatibility." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2338bdf8'/><path d='M25 50h50M50 25v50' stroke='white' stroke-width='12' stroke-linecap='round'/></svg>" />
  <script>
    (function() {
      const savedTheme = localStorage.getItem('playspec_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <style>
    body {
      background-color: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      position: relative;
    }

    .auth-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(99, 102, 241, 0.04) 50%, transparent 70%);
      pointer-events: none;
    }
    
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
      animation: scaleIn 0.2s ease-out;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .auth-logo-glyph {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--brand-blue), #2563eb);
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    .auth-title {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .steam-auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: linear-gradient(135deg, #171a21, #1b2838);
      color: #ffffff;
      border: 1px solid rgba(102, 192, 244, 0.35);
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-fast);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    .steam-auth-btn:hover {
      background: linear-gradient(135deg, #1b2838, #2a475e);
      border-color: var(--steam-blue);
      transform: translateY(-1px);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 20px 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }

    .auth-divider span {
      padding: 0 10px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--brand-blue);
      font-weight: 500;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div style="position: fixed; top: 20px; right: 20px; z-index: 100;">
    <button class="theme-toggle-btn" id="themeToggleBtn" role="switch" aria-checked="false" aria-label="Toggle Dark / Light Theme" title="Toggle Light / Dark Gamer Theme">
      <div class="theme-toggle-track">
        <span class="theme-icon moon-icon" title="Dark Mode (Cyber Ops)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="theme-icon sun-icon" title="Light Mode (Solar Matrix)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="5"></line>
            <line x1="12" y1="19" x2="12" y2="22"></line>
            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"></line>
            <line x1="2" y1="12" x2="5" y2="12"></line>
            <line x1="19" y1="12" x2="22" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
        <div class="theme-toggle-thumb">
          <span class="thumb-glow"></span>
        </div>
      </div>
    </button>
  </div>

  <div class="auth-glow"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo-glyph">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </div>
      <span style="font-family:var(--font-heading);font-weight:800;font-size:1.25rem;letter-spacing:-0.02em">PlaySpec</span>
    </div>

    <h1 class="auth-title">Welcome to PlaySpec</h1>
    <p class="auth-subtitle">Sign in with Steam to sync your games library, track price drops, and benchmark PC compatibility.</p>
    
    <!-- Primary Official Steam Sign In Button -->
    <a href="/api/auth/steam/login" class="steam-auth-btn">
      <svg width="22" height="22" viewBox="0 0 512 512" fill="currentColor">
        <path d="M255.9 0C114.6 0 0 114.6 0 256c0 102.7 60 191.1 147 232.8l20-56.1c-15.7-18.4-25.2-42-25.2-67.7 0-56.8 46.1-102.9 102.9-102.9 4.3 0 8.5 .3 12.6 .8l71.4-102.4c0-2.3-.2-4.5-.2-6.8 0-48.4 39.2-87.6 87.6-87.6 48.4 0 87.6 39.2 87.6 87.6s-39.2 87.6-87.6 87.6c-20 0-38.3-6.7-52.9-18l-72.2 103.5c.3 3.6 .4 7.2 .4 10.9 0 56.8-46.1 102.9-102.9 102.9-46.7 0-86-31.2-99.3-73.6l-111 31.9c37 42.1 91 68.6 150.8 68.6 113.3 0 205.1-91.8 205.1-205.1S369.2 51 255.9 51V0z"/>
      </svg>
      Sign In With Steam
    </a>

    <div class="auth-divider">
      <span>Or with email</span>
    </div>

    <form id="loginForm" onsubmit="handleEmailAuth(event)">
      <div class="rig-input-group" style="margin-bottom:12px">
        <label class="rig-input-label">Email Address</label>
        <input type="email" class="rig-input-field" id="authEmail" placeholder="gamer@example.com" required />
      </div>
      <div class="rig-input-group" style="margin-bottom:16px">
        <label class="rig-input-label">Password</label>
        <input type="password" class="rig-input-field" id="authPassword" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
    </form>

    <div class="auth-footer">
      <a href="/index.html">← Return to Dashboard</a>
    </div>
  </div>

  <script>
    function playSwitchSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(850, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    function initTheme() {
      const toggleBtn = document.getElementById('themeToggleBtn');
      const currentTheme = localStorage.getItem('playspec_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      if (toggleBtn) {
        toggleBtn.setAttribute('aria-checked', currentTheme === 'light' ? 'true' : 'false');
        toggleBtn.setAttribute('title', currentTheme === 'light' ? 'Switch to Dark Mode (Cyber Ops)' : 'Switch to Light Mode (Solar Matrix)');
        toggleBtn.addEventListener('click', () => {
          playSwitchSound();
          const activeTheme = document.documentElement.getAttribute('data-theme') || 'dark';
          const newTheme = activeTheme === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('playspec_theme', newTheme);
          toggleBtn.setAttribute('aria-checked', newTheme === 'light' ? 'true' : 'false');
          toggleBtn.setAttribute('title', newTheme === 'light' ? 'Switch to Dark Mode (Cyber Ops)' : 'Switch to Light Mode (Solar Matrix)');
        });
      }
    }
    initTheme();

    async function handleEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim().toLowerCase();
      const password = document.getElementById('authPassword').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('playspec_token', data.token);
          localStorage.setItem('playspec_user', JSON.stringify(data.user));
          window.location.href = '/index.html';
        } else {
          alert(data.error || 'Authentication failed');
        }
      } catch (err) {
        alert('Server unreachable');
      }
    }
  </script>
</body>
</html>
